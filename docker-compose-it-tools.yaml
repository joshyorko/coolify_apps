name: it-tools

services:
  it-tools:
    image: corentinth/it-tools

    networks:
      - it-network
    volumes:
      - it-tools-data:/data
    restart: unless-stopped

networks:
  it-network:
    driver: bridge

volumes:
  it-tools-data:

---


services:
  kali-linux:
    container_name: kali-linux
    image: lscr.io/linuxserver/kali-linux:latest
    security_opt:
      - seccomp=unconfined # optional
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      SUBFOLDER: "/" # optional
      TITLE: "Kali Linux" # optional
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - /path/to/data:/config
      - /var/run/docker.sock:/var/run/docker.sock # optional
    # Commented out the /dev/dri device mapping
    # devices:
    #   - /dev/dri:/dev/dri # optional
    shm_size: "1gb" # optional
    restart: unless-stopped
